name: Export catalog

# Reruns the export on a clean runner with the pinned engine and fails if the result differs
# from exports/ in the tree. That is the proof the committed catalogue came from the engine and
# not from a hand edit. It only runs when something that shapes the export changes.
on:
  pull_request:
    paths:
      - scripts/export_catalog.py
      - requirements-export.txt
      - exports/**
      - .github/workflows/export-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

# R2: only the latest push to a ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export catalog
    # Public repo: GitHub runners are free, and a self-hosted runner would run fork PRs locally.
    runs-on: ubuntu-latest
    # R3: a local SparkSession and ~440 DESCRIBE calls take a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-export.txt
      - run: pip install -r requirements-export.txt
      - name: Export from the engine
        run: python scripts/export_catalog.py
      - name: The committed catalogue is what the engine exports
        run: |
          git status --porcelain exports/
          git diff --stat --exit-code exports/
          test -z "$(git status --porcelain exports/)"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports/
          retention-days: 7
